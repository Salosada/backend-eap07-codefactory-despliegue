# Production profile for Render + TiDB Cloud
spring.docker.compose.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Bind on all interfaces inside the container (required for Render)
server.address=0.0.0.0

# TiDB Cloud — set SPRING_DATASOURCE_* in Render env (copy connection string from TiDB dashboard):
# jdbc:mysql://gateway01.us-west-2.prod.aws.tidbcloud.com:4000/appstripe?useSSL=true&requireSSL=true&serverTimezone=UTC

# CORS — set CORS_ALLOWED_ORIGINS in Render env, e.g.:
# https://your-app.vercel.app,https://*.vercel.app,http://localhost:3000
